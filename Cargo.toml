[package]
name = "tower-serve-static"
description = "Tower service that serves static files."
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/jannik4/tower-serve-static"
homepage = "https://github.com/jannik4/tower-serve-static"

[dependencies]
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project = "1"
tower-service = "0.3"

mime = "0.3"
mime_guess = "2"
percent-encoding = "2.3.2"

include_dir = { version = "0.7.4", default-features = false, features = [] }
httpdate = "1"
http-range-header = "1.1"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
papaya = "0.2.3"

[dev-dependencies]
axum = { version = "0.8.8" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["buffer", "util", "retry", "make"] }

[features]
metadata = ["include_dir/metadata"]
